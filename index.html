<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRIXTIN AI | Intelligence That Moves Business Forward.</title>
    <meta name="description" content="TRIXTIN AI turns artificial intelligence into practical solutions that help businesses automate, innovate and grow." />
    <meta name="theme-color" content="#10152B" />
    <meta property="og:title" content="TRIXTIN AI | Intelligence That Moves Business Forward." />
    <meta property="og:description" content="TRIXTIN AI turns artificial intelligence into practical solutions that help businesses automate, innovate and grow." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('trixtin-theme');
          if (t !== 'light' && t !== 'dark') t = 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
